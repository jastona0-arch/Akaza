<form action="/submit" method="post" autocomplete="on">
  <fieldset>
    <legend>User Registration</legend>

    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required autocomplete="username"><br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email"><br><br>

    <label for="age">Age:</label>
    <input type="number" id="age" name="age" min="18"><br><br>

    <label for="gender">Gender:</label>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>
    <input type="radio" id="other" name="gender" value="other">
    <label for="other">Other</label>
    <br><br>

    <label for="hobbies">Hobbies:</label>
    <input type="checkbox" id="sports" name="hobbies" value="sports">
    <label for="sports">Sports</label>
    <input type="checkbox" id="music" name="hobbies" value="music">
    <label for="music">Music</label>
    <input type="checkbox" id="reading" name="hobbies" value="reading">
    <label for="reading">Reading</label>
    <br><br>

    <label for="country">Country:</label>
    <select id="country" name="country">
      <optgroup label="Asia">
        <option value="in">India</option>
        <option value="jp">Japan</option>
      </optgroup>
      <optgroup label="Europe">
        <option value="uk">United Kingdom</option>
        <option value="fr">France</option>
      </optgroup>
    </select>
    <br><br>

    <label for="browser">Choose browser:</label>
    <input list="browsers" id="browser" name="browser" />
    <datalist id="browsers">
      <option value="Chrome">
      <option value="Firefox">
      <option value="Edge">
      <option value="Opera">
    </datalist>
    <br><br>

    <label for="bio">Short Bio:</label>
    <textarea id="bio" name="bio"></textarea>
    <br><br>

    <label for="score">Score (calculated):</label>
    <output name="score" id="score">0</output>
    <br><br>

    <button type="submit">Register</button>
    <button type="reset">Reset</button>
  </fieldset>
</form>
<form action="/submit" method="POST" autocomplete="on">

</form>
